[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-nhtsa"
version = "0.1.0"
description = "A Python data pipeline for ingesting and modeling NHTSA public API data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "neibaur" }]
dependencies = [
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nhtsa_pipeline = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--cov=nhtsa_pipeline --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["nhtsa_pipeline"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "N",
    "UP",
    "W",
]

[tool.mypy]
python_version = "3.11"
packages = ["nhtsa_pipeline"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
